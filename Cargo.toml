[package]
name = "jcode"
version = "0.54.4"
description = "Headless coding-agent runtime with multi-model and swarm coordination"
edition = "2024"
autobins = false

[workspace]
members = [
    ".",
    "crates/jcode-agent-runtime",
    "crates/jcode-app-core",
    "crates/jcode-base",
    "crates/jcode-build-meta",
    "crates/jcode-auth-types",
    "crates/jcode-embedding",
    "crates/jcode-import-core",
    "crates/jcode-pdf",
    "crates/jcode-logging",
    "crates/jcode-background-types",
    "crates/jcode-batch-types",
    "crates/jcode-compaction-core",
    "crates/jcode-config-types",
    "crates/jcode-core",
    "crates/jcode-memory-types",
    "crates/jcode-message-types",
    "crates/jcode-plan",
    "crates/jcode-swarm-core",
    "crates/jcode-protocol",
    "crates/jcode-session-types",
    "crates/jcode-storage",
    "crates/jcode-azure-auth",
    "crates/jcode-provider-metadata",
    "crates/jcode-provider-env",
    "crates/jcode-provider-core",
    "crates/jcode-provider-bedrock",
    "crates/jcode-provider-anthropic",
    "crates/jcode-provider-antigravity",
    "crates/jcode-provider-copilot",
    "crates/jcode-provider-openrouter",
    "crates/jcode-provider-openai",
    "crates/jcode-provider-gemini",
    "crates/jcode-provider-gemini-runtime",
    "crates/jcode-provider-cursor-runtime",
    "crates/jcode-provider-antigravity-runtime",
    "crates/jcode-provider-copilot-runtime",
    "crates/jcode-provider-openrouter-runtime",
    "crates/jcode-provider-anthropic-runtime",
    "crates/jcode-provider-openai-runtime",
    "crates/jcode-usage-types",
    "crates/jcode-task-types",
    "crates/jcode-tool-core",
    "crates/jcode-tool-types",
]

[lib]
name = "jcode"
path = "src/lib.rs"

[[bin]]
name = "jcode"
path = "src/main.rs"

[dependencies]
# Memory allocator (reduces fragmentation for long-running server)
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"], optional = true }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# TLS provider (installed as process default in main.rs)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# File operations

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }

# Embeddings (local inference) - behind feature flag (163 crates, slow to compile)

# Streaming
tokio-stream = "0.1"

# PDF parsing (behind feature flag)
jcode-build-meta = { path = "crates/jcode-build-meta" }
# Tiny leaf helpers (console/env/fs/id) used directly by the cli layer.
# Headless application core. The root crate contains only the CLI composition
# layer and re-exports this crate directly.
jcode-app-core = { path = "crates/jcode-app-core", default-features = false }
# Gemini provider runtime; sits downstream of jcode-base so gemini edits do
# not rebuild the base -> app-core spine. Registered with the external
# provider registry at startup (src/cli/startup.rs).
jcode-provider-gemini-runtime = { path = "crates/jcode-provider-gemini-runtime" }
jcode-provider-cursor-runtime = { path = "crates/jcode-provider-cursor-runtime" }
jcode-provider-antigravity-runtime = { path = "crates/jcode-provider-antigravity-runtime" }
jcode-provider-copilot-runtime = { path = "crates/jcode-provider-copilot-runtime" }
jcode-provider-openrouter-runtime = { path = "crates/jcode-provider-openrouter-runtime" }
jcode-provider-anthropic-runtime = { path = "crates/jcode-provider-anthropic-runtime" }
jcode-provider-openai-runtime = { path = "crates/jcode-provider-openai-runtime" }
tempfile = "3"

[features]
# Include local ONNX/tokenizer embeddings in default builds so memory recall,
# semantic retrieval, and embedding-backed features work out of the box.
# Use `JCODE_DEV_FEATURE_PROFILE=minimal` for compile-speed probes that need
# to skip optional default feature stacks.
default = ["pdf", "embeddings", "bedrock"]
jemalloc = [
    "dep:tikv-jemallocator",
    "tikv-jemallocator/stats",
    "jcode-app-core/jemalloc",
]
jemalloc-prof = [
    "jemalloc",
    "tikv-jemallocator/profiling",
    "jcode-app-core/jemalloc-prof",
]
# Local embeddings and PDF extraction live in jcode-base / jcode-app-core;
# these features just forward down the stack.
embeddings = ["jcode-app-core/embeddings"]
# Live AWS Bedrock support (the AWS SDK stack) lives in jcode-provider-bedrock;
# forwards down through jcode-app-core -> jcode-base.
bedrock = ["jcode-app-core/bedrock"]
# Internal release feature: build a supported OpenSSL inside the CentOS 7
pdf = ["jcode-app-core/pdf"]

[profile.release]
opt-level = 1
debug = 0
codegen-units = 256
incremental = true

[profile.selfdev]
inherits = "release"
opt-level = 0

# Full LTO release for stable/distribution builds
[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = false

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 0

# Keep the raster image pipeline optimized for model visual inputs.
[profile.dev.package.image]
opt-level = 3
[profile.selfdev.package.image]
opt-level = 3
[profile.test.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3
[profile.selfdev.package.png]
opt-level = 3
[profile.test.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.selfdev.package.zune-jpeg]
opt-level = 3
[profile.test.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
[profile.selfdev.package.fdeflate]
opt-level = 3
[profile.test.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.selfdev.package.miniz_oxide]
opt-level = 3
[profile.test.package.miniz_oxide]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3
[profile.selfdev.package.base64]
opt-level = 3
[profile.test.package.base64]
opt-level = 3

# session_search scans multi-megabyte session files with memchr-based
# case-insensitive matching; keep the SIMD scanner optimized everywhere.
[profile.dev.package.memchr]
opt-level = 3
[profile.selfdev.package.memchr]
opt-level = 3
[profile.test.package.memchr]
opt-level = 3

# The embedding stack (tract ONNX inference + HF tokenizer) runs the MiniLM
# model for memory recall/maintenance on the shared server. At opt-level 0 a
# single embed measured ~666 ms (matmul inner loops unoptimized), which keeps
# the model "busy" long enough that the idle unloader rarely fires and burns
# CPU on every memory-maintenance pass. These crates are pure compute and
# change only when the dependency is bumped, so the optimized objects are
# compiled once and cached across dev/selfdev iterations.
[profile.dev.package.tract-core]
opt-level = 3
[profile.selfdev.package.tract-core]
opt-level = 3
[profile.test.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.selfdev.package.tract-linalg]
opt-level = 3
[profile.test.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.selfdev.package.tract-data]
opt-level = 3
[profile.test.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.selfdev.package.tract-hir]
opt-level = 3
[profile.test.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.selfdev.package.tract-onnx]
opt-level = 3
[profile.test.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.selfdev.package.tract-onnx-opl]
opt-level = 3
[profile.test.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.selfdev.package.tract-nnef]
opt-level = 3
[profile.test.package.tract-nnef]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.selfdev.package.ndarray]
opt-level = 3
[profile.test.package.ndarray]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.selfdev.package.tokenizers]
opt-level = 3
[profile.test.package.tokenizers]
opt-level = 3

[profile.test]
debug = 0
incremental = true
codegen-units = 256

[dev-dependencies]
async-stream = "0.3"
# Enables downstream test-support helpers for the root crate's CLI tests.
jcode-app-core = { path = "crates/jcode-app-core", default-features = false, features = ["test-support"] }

[build-dependencies]
